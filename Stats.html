<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stat Tracker - Aspect Ratio Layout</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /*
        ================================================================================
        STYLING GUIDE (CSS)
        ================================================================================
        This template uses a three-unit strategy for maximum scalability and consistency.

        1. `rem` (Root EM): For all direct descendants of `#main-container`.
        2. `clamp()` for Accessible Font Sizing: For readable content text.
        3. `em`: For properties on nested elements.
        ================================================================================
        */

        body {
            margin: 0;
            overflow: hidden;
            background-color: #111; /* The color for letter/pillarboxing */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #main-container {
            position: absolute;
            background-color: #f0f4f8; /* Updated background to match original app */
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            transition: all 0.2s ease-in-out;
        }

        /* Direct descendants of #main-container use `rem` units */
        .sub-container {
            position: absolute;
            box-sizing: border-box;
            overflow: auto;
            color: #333;
        }

        #header {
            top: 2rem;
            left: 2rem;
            right: 2rem;
            height: 6rem;
            background-color: #4a90e2;
            color: white;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
        }

        #sidebar {
            top: 10rem;
            left: 2rem;
            width: 20rem;
            bottom: 2rem;
            background-color: #334155; /* Dark slate color */
            font-size: 1.2rem;
            padding: 1.5rem;
            border-radius: 1rem;
        }

        #content {
            top: 10rem;
            left: 24rem;
            right: 2rem;
            bottom: 2rem;
            background-color: transparent; /* Content BG is handled by inner element */
            container-type: inline-size;
            padding: 0; /* Remove padding to allow inner content full space */
        }
        
        /* Styles from the original Stat Tracker App */
        .stat-button {
            @apply bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105;
        }
        .send-button {
            @apply bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105;
        }

        /* Sidebar specific styles */
        .sidebar-title {
            font-size: 1.5em; /* Scales relative to #sidebar's font-size */
            margin: 0 0 1em 0;
            color: white;
            font-weight: 700;
        }

        .sidebar-item {
            padding: 0.8em; /* Scales relative to #sidebar's font-size */
            margin-bottom: 0.8em;
            background: rgba(255,255,255,0.1);
            border-radius: 0.5em;
            color: #e2e8f0;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .sidebar-item:hover {
            background: rgba(255,255,255,0.2);
        }

    </style>
</head>
<body>

<div id="main-container">
    <!-- Header -->
    <div id="header" class="sub-container" role="banner">
        <span>Character Stat Tracker</span>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sub-container" role="navigation">
        <h2 class="sidebar-title">Character Menu</h2>
        <div class="sidebar-item">Profile</div>
        <div class="sidebar-item">Inventory</div>
        <div class="sidebar-item">Skills</div>
        <div class="sidebar-item">Settings</div>
    </div>

    <!-- Main Content Area - Stat Tracker is placed here -->
    <div id="content" class="sub-container" role="main">
        <!-- This is the original stat tracker component -->
        <div class="bg-white p-8 rounded-xl shadow-2xl space-y-6 border border-gray-200 h-full w-full">
            <h1 class="text-3xl font-extrabold text-center text-gray-800 mb-6">Update Stats</h1>

            <!-- Stat Display Section -->
            <div class="flex flex-col space-y-4">
                <div class="flex items-center justify-between p-4 bg-purple-50 rounded-lg shadow-sm border border-purple-200">
                    <span class="text-lg font-semibold text-gray-700">Strength:</span>
                    <span id="strengthValue" class="text-xl font-bold text-purple-700">0</span>
                    <button id="increaseStrength" class="stat-button">Increase</button>
                </div>

                <div class="flex items-center justify-between p-4 bg-green-50 rounded-lg shadow-sm border border-green-200">
                    <span class="text-lg font-semibold text-gray-700">Wisdom:</span>
                    <span id="wisdomValue" class="text-xl font-bold text-green-700">0</span>
                    <button id="increaseWisdom" class="stat-button">Increase</button>
                </div>

                <div class="flex items-center justify-between p-4 bg-red-50 rounded-lg shadow-sm border border-red-200">
                    <span class="text-lg font-semibold text-gray-700">Loyalty:</span>
                    <span id="loyaltyValue" class="text-xl font-bold text-red-700">0</span>
                    <button id="increaseLoyalty" class="stat-button">Increase</button>
                </div>
            </div>

            <!-- Send Button -->
            <div class="mt-8 text-center">
                <button id="sendStats" class="send-button">Send Updated Stats</button>
            </div>
        </div>
    </div>
</div>

<script>
    /*
    ================================================================================
    CORE LOGIC (JAVASCRIPT)
    ================================================================================
    */

    // --- 1. LAYOUT ENGINE LOGIC ---
    function resizeLayout(){
        const mainContainer = document.getElementById('main-container');
        const htmlElement = document.documentElement;

        // --- CONFIGURATION ---
        const ASPECT_RATIO = 16 / 9;
        // ---------------------

        let viewportWidth = window.innerWidth;
        let viewportHeight = window.innerHeight;
        const viewportRatio = viewportWidth / viewportHeight;
        let containerWidth, containerHeight, top, left;

        if (viewportRatio > ASPECT_RATIO) {
            containerHeight = viewportHeight;
            containerWidth = containerHeight * ASPECT_RATIO;
            top = 0;
            left = (viewportWidth - containerWidth) / 2;
        } else {
            containerWidth = viewportWidth;
            containerHeight = containerWidth / ASPECT_RATIO;
            top = (viewportHeight - containerHeight) / 2;
            left = 0;
        }

        mainContainer.style.width = `${containerWidth}px`;
        mainContainer.style.height = `${containerHeight}px`;
        mainContainer.style.top = `${top}px`;
        mainContainer.style.left = `${left}px`;

        const rootFontSize = containerWidth / 100;
        htmlElement.style.fontSize = `${rootFontSize}px`;
    }

    // --- 2. STAT TRACKER APPLICATION LOGIC ---
    
    // Initialize stat variables
    let strength = 0;
    let wisdom = 0;
    let loyalty = 0;

    /**
     * Parses the URL query string to extract initial stat values.
     */
    function parseQueryString() {
        const params = new URLSearchParams(window.location.search);
        strength = parseInt(params.get('strength')) || 0;
        wisdom = parseInt(params.get('wisdom')) || 0;
        loyalty = parseInt(params.get('loyalty')) || 0;
    }

    /**
     * Updates the displayed values on the HTML page.
     */
    function updateDisplay() {
        document.getElementById('strengthValue').textContent = strength;
        document.getElementById('wisdomValue').textContent = wisdom;
        document.getElementById('loyaltyValue').textContent = loyalty;
    }

    /**
     * Sends the current stat values back to the parent window.
     */
    function sendStatsToParent() {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({
                type: 'statsUpdate',
                strength: strength,
                wisdom: wisdom,
                loyalty: loyalty
            }, '*');
        } else {
            console.warn("This page is not running inside an iframe. Cannot send message to parent.");
            const notification = document.createElement('div');
            notification.className = 'fixed top-5 right-5 bg-yellow-500 text-white py-2 px-4 rounded-lg shadow-lg';
            notification.style.fontSize = '16px'; // Ensure notification is readable
            notification.textContent = 'Not running in an iframe. Stats cannot be sent.';
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
    }

    // --- 3. EVENT LISTENERS ---

    // Layout listener
    window.addEventListener('load', resizeLayout);
    window.addEventListener('resize', resizeLayout);

    // Stat Tracker listeners
    document.addEventListener('DOMContentLoaded', () => {
        // Initial setup for the stat tracker
        parseQueryString();
        updateDisplay();

        // Attach button listeners
        document.getElementById('increaseStrength').addEventListener('click', () => {
            strength++;
            updateDisplay();
        });

        document.getElementById('increaseWisdom').addEventListener('click', () => {
            wisdom++;
            updateDisplay();
        });

        document.getElementById('increaseLoyalty').addEventListener('click', () => {
            loyalty++;
            updateDisplay();
        });

        document.getElementById('sendStats').addEventListener('click', sendStatsToParent);
    });
</script>
</body>
</html>
